[project]
name = "ontology-study"
version = "0.1.0"
description = "회의록에서 LLM으로 지식을 추출해 RDF 온톨로지 지식 그래프를 만드는 학습용 프로젝트"
requires-python = ">=3.14"
dependencies = [
    "openai>=3.42.1",
    "owlrl>=7.6.2",
    "pydantic>=2.14.2",
    "pyshacl>=0.40.2",
    "python-dotenv>=1.2.4",
    "rdflib>=7.6.0",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.3",
]
