# 샘플 회의록 정답지
#
# 사람이 기대하는 추출 결과입니다. `uv run python -m meeting_kg evaluate`가 이 파일을 기준으로
# output/graph.ttl을 채점합니다. 파이프라인은 samples/*.txt만 읽으므로 이 파일은 추출 대상이 아닙니다.
#
# [[tracked]]  할 일(ActionItem) · 고객 요청(CustomerRequest) · 이슈(Issue)
#   meeting    처음 등장하는 회의 날짜. 그래프 항목도 이 회의에서 생성되어야 매칭됩니다.
#   keywords   설명(description)에 모두 들어 있어야 하는 단어. "a|b"는 둘 중 하나. 띄어쓰기는 무시합니다.
#   exclude    설명에 들어 있으면 매칭하지 않는 단어
#   assignees  담당자 ID (data/reference.ttl)
#   customer   고객 요청의 요청 고객사 ID
#   due        최종 기한
#   status     회의 날짜별로 기대하는 상태. 목록이면 그중 하나면 정답
#   optional   true면 찾지 못해도 감점하지 않고, 찾으면 "정답에 없는 항목"으로 세지 않습니다.
#
# [[decisions]], [[knowledge]]  회의와 관계없이 그래프 전체에서 키워드로 찾습니다.
#
# ID: A=할 일, R=고객 요청, I=이슈, D=결정, K=지식. 상태: open, in_progress, blocked, done, cancelled

